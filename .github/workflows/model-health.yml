name: free-model-health
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - uses: actions/cache@v4
        with:
          path: ~/.config/codelaboon/model-health.json
          key: public-model-health-${{ github.run_id }}
          restore-keys: public-model-health-
      - name: Check public free routes and defer unconfigured accounts
        run: python -m codelaboon models check free --timeout 12 --require-working --jsonl > free-model-health.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-model-health
          path: free-model-health.jsonl
          retention-days: 14
