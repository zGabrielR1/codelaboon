name: portable security and operations contracts
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Scoped assessment, elevation and telemetry contracts
        env:
          CODELABOON_MODEL_CHECKS: '0'
          CODELABOON_METRICS: '0'
        run: python -m unittest discover -s tests -p test_rc20_portable.py -v
      - name: Native elevation bootstrap / Windows UAC parser
        run: python scripts/smoke_privilege_ci.py
      - name: RC21 web and IT security fixtures
        env:
          CODELABOON_MODEL_CHECKS: '0'
          CODELABOON_METRICS: '0'
        run: python -m unittest discover -s tests -p '*security*.py' -v
      - name: Cached runtime integrity and recovery contracts
        run: python -m unittest discover -s tests -p test_runtime_integrity.py -v
      - name: RC22 updater and terminal quality of life
        run: python -m unittest discover -s tests -p test_rc22_quality.py -v
      - name: Live task monitor and log following
        run: python -m unittest discover -s tests -p test_work_monitor.py -v
      - name: Portable task engines
        run: python -m unittest discover -s tests -p test_engine_tasks.py -v
      - name: Authenticated task GUI
        run: python -m unittest discover -s tests -p test_task_gui.py -v
      - name: Human task guidance
        run: python -m unittest discover -s tests -p test_task_conversation.py -v
      - name: RC23 task entry points
        run: python -m unittest discover -s tests -p test_rc23_tasks.py -v
      - name: Account providers, task operations and verified native installation
        run: python -m unittest discover -s tests -p test_provider_task_improvements.py -v
      - name: RC24 task model settings and project changes
        run: python -m unittest discover -s tests -p test_rc24_task_settings.py -v
  browser-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . playwright
      - run: python -m playwright install --with-deps chromium
      - name: Open and follow a task conversation in a real browser
        run: |
          mkdir -p .runtime
          set -o pipefail
          python scripts/smoke_task_chat.py 2>&1 | tee .runtime/browser-smoke.log
      - name: Surface browser smoke failure
        if: failure()
        run: |
          if [ -f .runtime/browser-smoke.log ]; then
            tail -25 .runtime/browser-smoke.log | sed 's/^/::error::/'
          else
            echo '::error::Browser smoke log missing.'
          fi
      - name: Task history, retries, scheduling and provider key privacy
        run: python scripts/smoke_task_operations.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-chat-browser
          path: .runtime/task-chat-qa/
