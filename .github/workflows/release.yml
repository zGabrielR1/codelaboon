name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  portable:
    uses: ./.github/workflows/portable.yml
  native:
    uses: ./.github/workflows/native-ui.yml
  desktop:
    uses: ./.github/workflows/desktop.yml
  build-and-release:
    needs: [native, portable, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build and runtime dependencies
        run: python -m pip install --upgrade pip build && python -m pip install '.[tui]'

      - name: Run offline unit tests
        run: bash scripts/test.sh

      - name: Run structural verification
        run: bash scripts/verify.sh

      - name: Audit release configuration for credential patterns
        run: |
          python -m codelaboon security audit-local --project . \
            --file config/providers.toml.example --file pyproject.toml \
            --file .github/workflows/release.yml --fail-on high \
            --output "${RUNNER_TEMP}/codelaboon-release-security.json"

      - name: Verify tag and package source bundles
        run: |
          python scripts/verify_bundles.py
          python - <<'PY'
          import os, tomllib
          from packaging.version import Version
          package = tomllib.load(open('pyproject.toml', 'rb'))
          assert Version(os.environ['GITHUB_REF_NAME'].removeprefix('v')) == Version(package['project']['version'])
          PY

      - name: Build wheel and source archive
        if: github.ref_name != 'v1.0.0-rc.42'
        run: |
          python -m build
          python scripts/verify_core.py dist

      - name: Stage separately downloadable engine sources
        if: github.ref_name != 'v1.0.0-rc.42'
        run: python scripts/stage_engine_assets.py --out dist

      - name: Build VS Code connector
        if: github.ref_name != 'v1.0.0-rc.42'
        run: python scripts/build_vscode.py dist/codelaboon-vscode.vsix

      - name: Write checksums
        if: github.ref_name != 'v1.0.0-rc.42'
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Verify the prebuilt RC42 assets
        if: github.ref_name == 'v1.0.0-rc.42'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="repos/$GITHUB_REPOSITORY/releases/453867675"
          test "$(gh api "$release" --jq '.tag_name + ":" + (.draft | tostring)')" = "$GITHUB_REF_NAME:true"
          mkdir -p dist
          assets=$(gh api "$release/assets" --jq '.[] | [.id, .name] | @tsv')
          while IFS=$'\t' read -r id name; do
            test "$id" -gt 0
            [[ "$name" =~ ^(codelaboon[-.A-Za-z0-9_]+|SHA256SUMS)$ ]]
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
              -H 'Accept: application/octet-stream' > "dist/$name"
          done <<< "$assets"
          cd dist
          echo "036fdaf350f6ac97e95cb0fb1854c0bba57e016ec1521d43b4e7954f7b8f6a36  SHA256SUMS" | sha256sum --check
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codelaboon-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_name != 'v1.0.0-rc.42'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE-RC42.md
          generate_release_notes: true
          prerelease: true
          fail_on_unmatched_files: true

      - name: Publish the verified RC42 draft
        if: github.ref_name == 'v1.0.0-rc.42'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/453867675" -F draft=false --jq .html_url
