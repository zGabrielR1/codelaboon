name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build and runtime dependencies
        run: python -m pip install --upgrade pip build && python -m pip install .

      - name: Run offline unit tests
        run: scripts/test.sh

      - name: Run structural verification
        run: scripts/verify.sh

      - name: Build wheel and source archive
        run: python -m build

      - name: Write checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codelaboon-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: true
          fail_on_unmatched_files: true
