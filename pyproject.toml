[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codelaboon"
version = "0.2.0"
description = "CLI harness for accessing AI models from multiple providers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "zGabrielR1", email = "gabrielrenostro581@gmail.com" }]
keywords = ["ai", "cli", "llm", "providers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = ["requests>=2.28"]

[project.scripts]
codelaboon = "codelaboon.cli:main"

[tool.setuptools]
packages = [
    "codelaboon",
    "providers",
    "providers.chatgpt",
    "providers.nvidia",
    "providers.openrouter",
    "providers.luna",
    "config",
]
