[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codelaboon"
version = "1.0.0rc37"
description = "CLI harness for accessing AI models from multiple providers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Personal Use Only" }
authors = [{ name = "zGabrielR1", email = "gabrielrenostro581@gmail.com" }]
keywords = ["ai", "cli", "llm", "providers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = ["requests>=2.28", "PyJWT[crypto]>=2.10,<3"]

[project.optional-dependencies]
tui = ["textual>=1.0"]
desktop = ["mcp>=1.12,<2", "playwright>=1.51,<2"]
native-desktop = ["mcp>=1.12,<2", "playwright>=1.51,<2", "pyautogui>=0.9.54,<1; sys_platform != 'linux'", "python-xlib>=0.33; sys_platform == 'linux'", "pillow>=10"]

[project.scripts]
codelaboon = "codelaboon.cli:main"
codelaboon-codex-vscode = "codelaboon.codex_engine:wrapper"
codelaboon-claude-vscode = "codelaboon.ide:claude_wrapper"

[tool.setuptools]
packages = [
    "codelaboon",
    "providers",
    "providers.chatgpt",
    "providers.claude",
    "providers.gemini",
    "providers.freebuff",
    "providers.qoder",
    "providers.nvidia",
    "providers.openrouter",
    "providers.luna",
    "providers.ourfree",
    "providers.kilo",
    "providers.pollinations",
    "providers.wusrouter",
    "config",
]

[tool.setuptools.package-data]
config = ["providers.toml.example"]
codelaboon = ["static/*", "integrations/vscode/*", "integrations/claude-browser/*", "_vendor/engines.json", "prompts/*.md", "themes/*", "themes/opencode/*.json", "themes/omp/*.json"]
